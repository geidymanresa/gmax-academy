<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear contraseña — GMAX Insurance Academy</title>
<style>
  body{font-family:Arial,sans-serif;max-width:440px;margin:80px auto;padding:0 20px;color:#1a1a2e;}
  h1{font-size:22px;color:#0b3d66;margin-bottom:8px;}
  p{color:#555;line-height:1.5;font-size:14px;}
  input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:15px;box-sizing:border-box;}
  button{width:100%;background:#0b5ed7;color:#fff;border:none;padding:14px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:12px;}
  button:disabled{background:#999;}
  #msg{margin-top:16px;padding:14px;border-radius:8px;font-size:14px;display:none;}
  #msg.ok{background:#e8f7ee;border:1.5px solid #34a853;color:#1e6b3d;}
  #msg.error{background:#fdecec;border:1.5px solid #d64545;color:#a12a2a;}
  a{color:#0b5ed7;font-weight:bold;text-decoration:none;}
  #loading{color:#888;font-size:14px;}
</style>
</head>
<body>

<h1>Crea tu contraseña</h1>
<p id="intro">Escribe tu nueva contraseña para poder entrar a tus cursos.</p>
<p id="loading">Verificando tu link...</p>

<form id="pwForm" style="display:none;">
  <input type="password" id="pw1" placeholder="Nueva contraseña" minlength="6" required>
  <input type="password" id="pw2" placeholder="Confirma tu contraseña" minlength="6" required>
  <button type="submit" id="btnSubmit">Guardar contraseña</button>
</form>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://kxdkmtpyduuruhhzfpmg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dCutSlRXT1IbMMXLOc4RYw__ztiQBE4';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const intro = document.getElementById('intro');
const loading = document.getElementById('loading');
const form = document.getElementById('pwForm');
const msg = document.getElementById('msg');

function showMsg(text, ok) {
  msg.style.display = 'block';
  msg.className = ok ? 'ok' : 'error';
  msg.textContent = text;
}

function showForm() {
  loading.style.display = 'none';
  form.style.display = 'block';
}

function showExpired() {
  loading.style.display = 'none';
  intro.textContent = 'Este link ya no es válido o expiró. Pide uno nuevo desde la página de inicio de sesión.';
}

async function init() {
  // Formato nuevo (PKCE): la URL trae ?code=xxxxx
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');

  if (code) {
    const { error } = await supabase.auth.exchangeCodeForSession(code);
    if (error) {
      console.error('exchangeCodeForSession error:', error);
      showExpired();
    } else {
      showForm();
    }
    return;
  }

  // Formato viejo (implicit): la URL trae #access_token=...&type=recovery
  // supabase-js lo detecta solo y dispara este evento.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
      showForm();
    }
  });

  // Por si el evento ya se disparó antes de registrar el listener.
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    showForm();
  } else {
    setTimeout(() => {
      if (form.style.display === 'none') {
        showExpired();
      }
    }, 3000);
  }
}

init();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;

  if (pw1.length < 6) {
    showMsg('La contraseña debe tener al menos 6 caracteres.', false);
    return;
  }
  if (pw1 !== pw2) {
    showMsg('Las contraseñas no coinciden.', false);
    return;
  }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  const { error } = await supabase.auth.updateUser({ password: pw1 });

  if (error) {
    showMsg('Error: ' + error.message, false);
    btn.disabled = false;
    btn.textContent = 'Guardar contraseña';
  } else {
    form.style.display = 'none';
    intro.style.display = 'none';
    showMsg('¡Listo! Tu contraseña quedó guardada. Ya puedes iniciar sesión.', true);
    msg.innerHTML += '<br><br><a href="/login.html">Ir a iniciar sesión →</a>';
  }
});
</script>

</body>
</html>
