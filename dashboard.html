<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Curso — GMAX Insurance Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2447; --blue:#1E4C9A; --blue-light:#2E5FB8;
    --gold:#F0B429; --gold-dark:#D69A1C;
    --bg:#F5F7FB; --ink:#12294F; --slate:#5A6478; --line:#E1E5EF; --white:#FFFFFF;
    --success:#2A7A3B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);}
  h1,h2,h3{font-family:'Sora',sans-serif;}
  a{text-decoration:none;color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}

  #gate{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;font-family:'Sora',sans-serif;text-align:center;padding:20px;}
  #gate.hidden{display:none;}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .gate-btn{margin-top:10px;background:var(--gold);color:var(--navy);border:none;padding:12px 24px;border-radius:9px;font-weight:700;font-family:'Sora',sans-serif;}

  #app{display:none;}
  #app.ready{display:flex;min-height:100vh;}

  .sidebar{width:300px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .sidebar-head{padding:22px 22px 16px;border-bottom:1px solid var(--line);}
  .sidebar-head .logo{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;color:var(--navy);margin-bottom:4px;}
  .sidebar-head .course-name{font-size:13px;color:var(--slate);}
  .progress-wrap{padding:16px 22px;border-bottom:1px solid var(--line);}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--slate);margin-bottom:8px;font-weight:600;}
  .progress-bar{height:8px;background:var(--line);border-radius:100px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);border-radius:100px;transition:width .3s;}

  .nav-scroll{flex:1;overflow-y:auto;padding:10px 0;}
  .nav-item-special{display:flex;align-items:center;gap:10px;padding:12px 22px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;background:var(--bg);margin:0 12px 8px;border-radius:9px;}
  .nav-item-special.active{background:var(--navy);color:#fff;}
  .nav-item-special.locked-nav{opacity:.55;cursor:not-allowed;font-size:12.5px;}
  .side-chapter{margin-bottom:2px;}
  .side-chapter-head{display:flex;align-items:center;gap:8px;padding:11px 22px;cursor:pointer;user-select:none;}
  .side-chapter-head:hover{background:var(--bg);}
  .side-chapter-num{font-family:'Sora',sans-serif;font-size:11px;font-weight:800;color:var(--gold-dark);background:#FBF0D9;padding:2px 7px;border-radius:5px;flex:none;}
  .side-chapter-title{flex:1;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);}
  .side-chapter-arrow{font-size:11px;color:var(--slate);transition:transform .15s;flex:none;}
  .side-chapter.collapsed .side-chapter-arrow{transform:rotate(-90deg);}
  .side-chapter.collapsed .side-chapter-lessons{display:none;}
  .chapter{margin-bottom:4px;}
  .chapter-title{padding:11px 22px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--slate);}
  .lesson-item{display:flex;align-items:center;gap:10px;padding:10px 22px 10px 30px;font-size:13.5px;color:var(--ink);cursor:pointer;border-left:3px solid transparent;}
  .lesson-item:hover{background:var(--bg);}
  .lesson-item.active{background:#EAF0FB;border-left-color:var(--blue);font-weight:600;}
  .lesson-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .lesson-check.done{background:var(--blue);border-color:var(--blue);color:#fff;}

  .lesson-nav-buttons{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);}
  .nav-btn{font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;padding:12px 20px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .nav-btn:hover{border-color:var(--blue);color:var(--blue);}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .nav-btn:disabled:hover{border-color:var(--line);color:var(--ink);}
  .nav-btn.next{background:var(--blue);color:#fff;border-color:var(--blue);}
  .nav-btn.next:hover{background:var(--blue-light);}

  .sidebar-foot{padding:16px 22px;border-top:1px solid var(--line);}
  .logout-btn{width:100%;padding:10px;border-radius:8px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);font-size:13px;font-weight:600;}

  .main{flex:1;padding:36px 44px;max-width:920px;}
  .video-wrap{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;margin-bottom:26px;}
  .video-wrap iframe, .video-wrap video{width:100%;height:100%;border:none;}
  .video-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#8C9AB8;font-size:14px;}

  .lesson-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .lesson-head h1{font-size:22px;font-weight:800;color:var(--navy);}
  .complete-btn{background:var(--blue);color:#fff;border:none;padding:11px 20px;border-radius:9px;font-weight:700;font-family:'Sora',sans-serif;font-size:13px;white-space:nowrap;}
  .complete-btn.done{background:var(--success);}

  .lesson-desc{color:var(--slate);font-size:14.5px;line-height:1.7;margin-bottom:24px;}
  .links-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;}
  .links-card h3{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  .links-card a{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--blue);font-weight:600;padding:8px 0;border-top:1px solid var(--line);}
  .links-card a:first-of-type{border-top:none;}

  .empty-course{text-align:center;padding:80px 20px;color:var(--slate);}
  .empty-course a{color:var(--blue);font-weight:700;}

  .support-fab{
    position:fixed;right:22px;bottom:22px;z-index:150;
    width:56px;height:56px;border-radius:50%;
    background:var(--navy);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;box-shadow:0 10px 30px rgba(15,36,71,.35);
    cursor:pointer;transition:transform .15s, background .15s;
  }
  .support-fab:hover{background:var(--blue);transform:translateY(-2px);}
  @media(max-width:900px){
    .support-fab{right:16px;bottom:16px;width:50px;height:50px;font-size:19px;}
  }

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,36,71,.55);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:32px;}
  .modal h2{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:18px;}
  .form-row{margin-bottom:16px;}
  .form-row label{font-family:'Sora',sans-serif;font-size:12.5px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px;}
  .form-row input,.form-row textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;font-family:'Inter',sans-serif;}
  .form-row textarea{resize:vertical;min-height:90px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
  .msg-inline{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none;}
  .msg-inline.show{display:block;}
  .msg-inline.error{background:#FCE9E9;color:#D64545;}
  .msg-inline.ok{background:#E8F3EA;color:var(--success);}
  .ticket-item{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .ticket-item .t-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--slate);margin-bottom:4px;}
  .ticket-item .t-subject{font-weight:700;font-size:13.5px;color:var(--navy);}
  .ticket-badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:700;}
  .ticket-badge.abierto{background:#FBF0D9;color:#8A6300;}
  .ticket-badge.respondido{background:#E8F3EA;color:var(--success);}
  .ticket-badge.cerrado{background:#F0F1F5;color:var(--slate);}
  .ticket-reply{background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;}

  @media(max-width:900px){
    .sidebar{position:fixed;left:-300px;top:0;bottom:0;z-index:100;transition:left .2s;}
    .sidebar.open{left:0;}
    .main{padding:20px;}
  }
</style>
</head>
<body>

<div id="gate">
  <div class="spinner"></div>
  <div>Cargando tu curso...</div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <a href="mis-cursos.html" style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:12px;">← Mis cursos</a>
      <div class="logo">GMAX Insurance Academy</div>
      <div class="course-name" id="courseName">—</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Tu progreso</span><span id="progressPct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    </div>
    <a href="#" id="examLink" class="nav-item-special" style="display:none;">🏆 Examen Final de Práctica</a>
    <div class="nav-scroll" id="navScroll"></div>
    <div class="sidebar-foot">
      <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main" id="mainArea">
    <!-- contenido inyectado por JS -->
  </main>
</div>

<!-- Burbuja flotante de Soporte: fija en la esquina, no estorba el contenido -->
<button type="button" class="support-fab" id="openSupportBtn" title="Soporte" aria-label="Soporte">🆘</button>

<!-- MODAL: SOPORTE -->
<div class="modal-overlay" id="supportModal">
  <div class="modal">
    <h2>Soporte</h2>
    <div class="msg-inline" id="supportMsg"></div>

    <div id="supportHistory" style="margin-bottom:20px;"></div>

    <div style="border-top:1px solid var(--line);padding-top:18px;">
      <div class="form-row"><label>Asunto (opcional)</label><input type="text" id="supportSubjectInput" placeholder="Ej. No puedo ver el video de la clase 3"></div>
      <div class="form-row"><label>Tu mensaje</label><textarea id="supportMessageInput" placeholder="Cuéntanos qué problema o duda tienes..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="nav-btn" type="button" id="closeSupportBtn">Cerrar</button>
      <button class="nav-btn next" type="button" id="sendSupportBtn">Enviar mensaje</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kxdkmtpyduuruhhzfpmg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dCutSlRXT1IbMMXLOc4RYw__ztiQBE4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentCourse = null;
let currentEnrollmentId = null;
let isPreviewMode = false;
let allLessons = []; // lista plana: {id, title, video_url, description, resource_links, type: 'intro'|'lesson'|'outro', chapterTitle}
let progressMap = {}; // lesson_id -> completed bool
let activeItemIndex = 0;

function showGateMessage(html, showLogout){
  document.getElementById('gate').innerHTML = `
    <div style="max-width:360px;">
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:18px;margin-bottom:10px;">GMAX Insurance Academy</div>
      <div style="color:#C6D2E8;font-size:14.5px;line-height:1.6;">${html}</div>
      ${showLogout ? '<button class="gate-btn" onclick="doLogout()">Ir a iniciar sesión</button>' : ''}
    </div>`;
}

window.doLogout = async function(){
  await sb.auth.signOut();
  window.location.href = 'login.html';
};

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ window.location.href = 'login.html'; return; }
  currentUser = session.user;

  const { data: profile } = await sb.from('profiles').select('role').eq('id', currentUser.id).single();
  const isAdmin = profile && (profile.role === 'admin' || profile.role === 'super_admin');

  const params = new URLSearchParams(window.location.search);
  const previewCourseId = params.get('preview');

  if (previewCourseId && isAdmin){
    const { data: course } = await sb.from('courses').select('*').eq('id', previewCourseId).single();
    if (!course){
      showGateMessage('No se encontró ese curso.', false);
      return;
    }
    currentCourse = course;
    isPreviewMode = true;
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.add('ready');
    document.getElementById('courseName').textContent = currentCourse.title + ' (Vista previa)';
    document.getElementById('openSupportBtn').style.display = 'none';
    await loadCourseContent();
    return;
  }

  // Verifica que este sea el dispositivo activo (control de 1 sesión a la vez)
  const localToken = localStorage.getItem('gmax_session_token');
  const { data: sessionRow } = await sb.from('active_sessions').select('session_token').eq('user_id', currentUser.id).single();
  if (sessionRow && localToken && sessionRow.session_token !== localToken){
    showGateMessage('Tu sesión se abrió en otro dispositivo. Por seguridad, solo se puede ver el curso desde un dispositivo a la vez.', true);
    return;
  }

  await loadEnrollments();
}

async function loadEnrollments(){
  const params = new URLSearchParams(window.location.search);
  const requestedCourseId = params.get('course');

  let query = sb
    .from('enrollments')
    .select('*, courses(*)')
    .eq('user_id', currentUser.id)
    .eq('status', 'active')
    .gt('expires_at', new Date().toISOString())
    .order('starts_at', {ascending:false});

  if (requestedCourseId) query = query.eq('course_id', requestedCourseId);

  const { data: enrollments } = await query;

  if (!enrollments || enrollments.length === 0){
    showGateMessage('Todavía no tienes ningún curso activo, o tu acceso venció. <br><br><a href="index.html#catalogo" style="color:var(--gold);font-weight:700;">Ver catálogo de cursos →</a>', false);
    return;
  }

  currentCourse = enrollments[0].courses;
  currentEnrollmentId = enrollments[0].id;
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.add('ready');
  document.getElementById('courseName').textContent = currentCourse.title;

  await loadCourseContent(enrollments[0].last_lesson_id);
}

async function loadCourseContent(lastLessonId){
  const { data: chapters } = await sb
    .from('chapters').select('*, lessons(*)')
    .eq('course_id', currentCourse.id)
    .order('position');

  allLessons = [];
  if (currentCourse.intro_video_url){
    allLessons.push({ id:'intro', title:'Video de Bienvenida', video_url: currentCourse.intro_video_url, description:'Antes de empezar, mira este mensaje de bienvenida al curso.', resource_links:[], type:'intro' });
  }
  (chapters||[]).sort((a,b)=>a.position-b.position).forEach(ch => {
    (ch.lessons||[]).sort((a,b)=>a.position-b.position).forEach(l => {
      allLessons.push({ id:l.id, title:l.title, video_url:l.video_url, description:l.description, text_content:l.text_content, content_type:l.content_type||'video', resource_links:l.resource_links||[], type:'lesson', chapterTitle: ch.title });
    });
  });
  if (currentCourse.outro_video_url){
    allLessons.push({ id:'outro', title:'Video de Despedida', video_url: currentCourse.outro_video_url, description:'¡Felicidades por completar el curso! Mira este mensaje final.', resource_links:[], type:'outro' });
  }

  const realLessonIds = allLessons.filter(l=>l.type==='lesson').map(l=>l.id);
  if (realLessonIds.length){
    const { data: progress } = await sb.from('lesson_progress').select('lesson_id, completed').eq('user_id', currentUser.id).in('lesson_id', realLessonIds);
    progressMap = {};
    (progress||[]).forEach(p => { progressMap[p.lesson_id] = p.completed; });
  }

  renderSidebar();
  await setupExamLink();
  let startIdx = 0;
  if (lastLessonId){
    const foundIdx = allLessons.findIndex(l => l.id === lastLessonId);
    if (foundIdx >= 0) startIdx = foundIdx;
  }
  selectItem(startIdx);
}

function renderSidebar(){
  const nav = document.getElementById('navScroll');
  let html = '';
  let chapterNum = 0;
  let lastChapter = null;
  let chapterOpen = false;

  allLessons.forEach((item, idx) => {
    if (item.type === 'intro'){
      html += `<div class="nav-item-special" data-idx="${idx}" onclick="selectItem(${idx})">🎬 ${item.title}</div>`;
    } else if (item.type === 'outro'){
      if (chapterOpen) html += `</div></div>`;
      chapterOpen = false;
      html += `<div class="nav-item-special" data-idx="${idx}" onclick="selectItem(${idx})">🏁 ${item.title}</div>`;
    } else {
      if (item.chapterTitle !== lastChapter){
        if (chapterOpen) html += `</div></div>`;
        chapterNum++;
        lastChapter = item.chapterTitle;
        html += `
          <div class="side-chapter collapsed" id="sidechapter-${chapterNum}">
            <div class="side-chapter-head" onclick="toggleSideChapter(${chapterNum})">
              <span class="side-chapter-num">Cap. ${chapterNum}</span>
              <span class="side-chapter-title">${item.chapterTitle}</span>
              <span class="side-chapter-arrow">▾</span>
            </div>
            <div class="side-chapter-lessons">`;
        chapterOpen = true;
      }
      const done = progressMap[item.id];
      const isExam = item.content_type === 'chapter_exam';
      html += `
        <div class="lesson-item" data-idx="${idx}" onclick="selectItem(${idx})">
          <span class="lesson-check ${done?'done':''}">${isExam ? '📝' : (done?'✓':'')}</span>
          <span>${item.title}</span>
        </div>`;
    }
  });
  if (chapterOpen) html += `</div></div>`;

  nav.innerHTML = html;
  updateProgressBar();
}

window.toggleSideChapter = function(num){
  document.getElementById('sidechapter-' + num).classList.toggle('collapsed');
};

function updateProgressBar(){
  const lessons = allLessons.filter(l=>l.type==='lesson' && l.content_type!=='chapter_exam');
  const done = lessons.filter(l=>progressMap[l.id]).length;
  const pct = lessons.length ? Math.round((done/lessons.length)*100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

// ---------- ENLACE AL EXAMEN FINAL (se desbloquea al completar todas las lecciones) ----------
async function setupExamLink(){
  const examLinkEl = document.getElementById('examLink');
  const { data: finalCfg } = await sb.from('exam_configs').select('id').eq('course_id', currentCourse.id).eq('config_type', 'final_exam').maybeSingle();
  if (!finalCfg){
    examLinkEl.style.display = 'none';
    return;
  }
  examLinkEl.href = 'examen.html?course=' + currentCourse.id + '&final=1';
  examLinkEl.style.display = 'flex';

  const lessonsOnly = allLessons.filter(l => l.type === 'lesson' && l.content_type !== 'chapter_exam');
  const doneCount = lessonsOnly.filter(l => progressMap[l.id]).length;
  const isComplete = lessonsOnly.length > 0 && doneCount >= lessonsOnly.length;

  if (isComplete){
    examLinkEl.textContent = '🏆 Examen Final de Práctica';
    examLinkEl.classList.remove('locked-nav');
  } else {
    examLinkEl.textContent = `🔒 Examen Final (${doneCount}/${lessonsOnly.length} lecciones)`;
    examLinkEl.classList.add('locked-nav');
  }
}

document.getElementById('examLink').addEventListener('click', (e) => {
  if (document.getElementById('examLink').classList.contains('locked-nav')){
    e.preventDefault();
    alert('Todavía te faltan lecciones por completar. Termina todas las clases del curso para desbloquear el examen final.');
  }
});

window.selectItem = function(idx){
  activeItemIndex = idx;
  document.querySelectorAll('.lesson-item, .nav-item-special').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`[data-idx="${idx}"]`);
  if (el){
    el.classList.add('active');
    const parentChapter = el.closest('.side-chapter');
    if (parentChapter) parentChapter.classList.remove('collapsed');
  }
  renderMain(allLessons[idx]);

  // Guarda automáticamente hasta dónde llegó (no aplica en modo vista previa)
  const item = allLessons[idx];
  if (!isPreviewMode && currentEnrollmentId && item && item.type === 'lesson'){
    sb.from('enrollments').update({ last_lesson_id: item.id }).eq('id', currentEnrollmentId);
  }
};

function resourceIcon(rtype){
  return { document:'📄', image:'🖼️', link:'🔗' }[rtype] || '🔗';
}

function videoEmbed(url){
  if (!url) return '<div class="video-placeholder">Todavía no se ha subido el video de esta lección.</div>';
  return `<iframe src="${url}" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
}

async function renderMain(item){
  const main = document.getElementById('mainArea');
  const isRealLesson = item.type === 'lesson';
  const done = isRealLesson && progressMap[item.id];
  const contentType = item.content_type || 'video';

  const linksHtml = (item.resource_links && item.resource_links.length)
    ? `<div class="links-card"><h3>Recursos de esta clase</h3>${item.resource_links.map(l => `<a href="${l.url}" target="_blank">${resourceIcon(l.rtype)} ${l.label || l.url}</a>`).join('')}</div>`
    : '';

  const completeBadgeHtml = (isRealLesson && contentType !== 'quiz' && done)
    ? `<span style="background:#EAF0FB;color:var(--blue);font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:9px;white-space:nowrap;">✓ Completada</span>`
    : '';

  let mediaHtml = '';
  if (contentType === 'video' || item.type === 'intro' || item.type === 'outro'){
    mediaHtml = `<div class="video-wrap">${videoEmbed(item.video_url)}</div>`;
  } else if (contentType === 'image'){
    mediaHtml = item.video_url
      ? `<div style="border-radius:16px;overflow:hidden;margin-bottom:26px;"><img src="${item.video_url}" style="width:100%;display:block;"></div>`
      : `<div class="video-wrap"><div class="video-placeholder">Todavía no se ha subido la imagen de esta lección.</div></div>`;
  } else if (contentType === 'document'){
    mediaHtml = item.video_url
      ? `<div class="video-wrap"><iframe src="${item.video_url}" loading="lazy"></iframe></div><div style="margin:-12px 0 20px;"><a href="${item.video_url}" target="_blank" class="complete-btn" style="display:inline-block;text-decoration:none;">Abrir documento en una pestaña nueva ↗</a></div>`
      : `<div class="video-wrap"><div class="video-placeholder">Todavía no se ha subido el documento de esta lección.</div></div>`;
  }
  // Para 'text' no hay media arriba, el texto enriquecido se muestra como cuerpo principal.

  const isFirst = activeItemIndex === 0;
  const isLast = activeItemIndex === allLessons.length - 1;
  const marksProgress = item.type === 'lesson' && contentType !== 'chapter_exam';
  const navButtonsHtml = `
    <div class="lesson-nav-buttons">
      <button class="nav-btn prev" ${isFirst?'disabled':''} onclick="selectItem(${activeItemIndex - 1})">← Clase anterior</button>
      <button class="nav-btn next" ${isLast?'disabled':''} onclick="goToNext(${marksProgress ? `'${item.id}'` : 'null'}, ${activeItemIndex + 1})">Siguiente clase →</button>
    </div>`;

  if (contentType === 'quiz'){
    main.innerHTML = `
      <div class="lesson-head"><h1>${item.title}</h1></div>
      <p class="lesson-desc">${item.description || ''}</p>
      <div id="quizArea"><div class="empty-course">Cargando cuestionario...</div></div>
      ${navButtonsHtml}
    `;
    renderQuiz(item.id);
    return;
  }

  if (contentType === 'chapter_exam'){
    const chapterNum = item.video_url;
    main.innerHTML = `
      <div class="lesson-head"><h1>${item.title}</h1></div>
      <p class="lesson-desc">${item.description || ''}</p>
      <div class="links-card" style="text-align:center;padding:38px 24px;">
        <div style="font-size:32px;margin-bottom:10px;">📝</div>
        <h3 style="margin-bottom:8px;">Examen de práctica — Capítulo ${chapterNum}</h3>
        <p style="color:var(--slate);font-size:13.5px;margin-bottom:20px;">15 preguntas aleatorias de este capítulo, corrección al instante. Puedes repetirlo las veces que quieras.</p>
        <button class="complete-btn" onclick="window.location.href='examen.html?course=${currentCourse.id}&chapter=${chapterNum}'">Comenzar examen del Capítulo ${chapterNum}</button>
      </div>
      ${navButtonsHtml}
    `;
    return;
  }

  main.innerHTML = `
    ${mediaHtml}
    <div class="lesson-head">
      <h1>${item.title}</h1>
      ${completeBadgeHtml}
    </div>
    ${contentType === 'text' ? `<div class="lesson-desc" style="font-size:15px;">${item.text_content || 'Contenido no disponible todavía.'}</div>` : ''}
    <p class="lesson-desc">${item.description || (contentType==='text' ? '' : 'Sin descripción todavía.')}</p>
    ${linksHtml}
    ${navButtonsHtml}
  `;
}

async function renderQuiz(lessonId){
  const { data: quiz } = await sb.from('quizzes').select('*, quiz_questions(*, quiz_options(*))').eq('lesson_id', lessonId).single();
  const quizArea = document.getElementById('quizArea');
  if (!quiz || !quiz.quiz_questions || !quiz.quiz_questions.length){
    quizArea.innerHTML = '<div class="empty-course">Este cuestionario todavía no tiene preguntas.</div>';
    return;
  }
  const questions = quiz.quiz_questions.sort((a,b)=>a.position-b.position);

  quizArea.innerHTML = questions.map((q, qi) => {
    const multi = q.quiz_options.filter(o=>o.is_correct).length > 1;
    const optionsHtml = q.quiz_options.map((o, oi) => `
      <label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;">
        <input type="${multi?'checkbox':'radio'}" name="q${qi}" value="${o.id}">
        <span>${o.option_text}</span>
      </label>
    `).join('');
    return `
      <div class="links-card" style="margin-bottom:16px;">
        <h3>${qi+1}. ${q.question_text}</h3>
        <div style="margin-top:10px;">${optionsHtml}</div>
      </div>`;
  }).join('') + `<button class="complete-btn" id="submitQuizBtn">Calificar cuestionario</button><div id="quizResult" style="margin-top:16px;"></div>`;

  document.getElementById('submitQuizBtn').addEventListener('click', async () => {
    let correctCount = 0;
    questions.forEach((q, qi) => {
      const checked = [...document.querySelectorAll(`input[name="q${qi}"]:checked`)].map(i=>i.value);
      const correctIds = q.quiz_options.filter(o=>o.is_correct).map(o=>o.id);
      const isCorrect = checked.length === correctIds.length && checked.every(id => correctIds.includes(id));
      if (isCorrect) correctCount++;
    });
    const pct = Math.round((correctCount / questions.length) * 100);
    const passed = pct >= (quiz.passing_score || 70);

    await sb.from('quiz_attempts').insert({ user_id: currentUser.id, quiz_id: quiz.id, score: pct, passed });

    document.getElementById('quizResult').innerHTML = `
      <div class="links-card" style="text-align:center;background:${passed?'#E8F3EA':'#FCE9E9'};">
        <h3 style="color:${passed?'var(--success)':'#D64545'};font-size:18px;">
          ${passed ? '✓ ¡Aprobaste!' : '✗ No aprobaste todavía'}
        </h3>
        <p style="margin-top:6px;color:var(--slate);">Sacaste ${pct}% — necesitas ${quiz.passing_score || 70}% para aprobar.</p>
      </div>`;
  });
}

async function toggleComplete(lessonId){
  const newVal = !progressMap[lessonId];
  await sb.from('lesson_progress').upsert({
    user_id: currentUser.id, lesson_id: lessonId, completed: newVal, updated_at: new Date().toISOString()
  });
  progressMap[lessonId] = newVal;
  renderSidebar();
  document.querySelector(`[data-idx="${activeItemIndex}"]`).classList.add('active');
  renderMain(allLessons[activeItemIndex]);
}

window.goToNext = async function(currentLessonId, nextIdx){
  // Al avanzar, marca la clase actual como completada automáticamente (si no lo estaba ya)
  if (currentLessonId && !progressMap[currentLessonId]){
    await sb.from('lesson_progress').upsert({
      user_id: currentUser.id, lesson_id: currentLessonId, completed: true, updated_at: new Date().toISOString()
    });
    progressMap[currentLessonId] = true;
  }
  renderSidebar();
  selectItem(nextIdx);
};

document.getElementById('logoutBtn').addEventListener('click', doLogout);

// ---------- SOPORTE ----------
function escapeHtmlDash(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('openSupportBtn').addEventListener('click', openSupportPanel);
document.getElementById('closeSupportBtn').addEventListener('click', ()=> document.getElementById('supportModal').classList.remove('open'));

async function openSupportPanel(){
  document.getElementById('supportMsg').className = 'msg-inline';
  document.getElementById('supportSubjectInput').value = '';
  document.getElementById('supportMessageInput').value = '';
  await loadSupportHistory();
  document.getElementById('supportModal').classList.add('open');
}

async function loadSupportHistory(){
  const wrap = document.getElementById('supportHistory');
  const { data: tickets, error } = await sb
    .from('support_tickets')
    .select('*, support_replies(*)')
    .eq('user_id', currentUser.id)
    .order('created_at', {ascending:false});

  if (error || !tickets || tickets.length === 0){
    wrap.innerHTML = '<p style="color:var(--slate);font-size:13px;margin-bottom:6px;">Todavía no has enviado ningún mensaje de soporte.</p>';
    return;
  }

  wrap.innerHTML = tickets.map(t => {
    const replies = (t.support_replies||[]).slice().sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
    const repliesHtml = replies.map(r => `
      <div class="ticket-reply">
        <b>${r.sender_role==='admin' ? 'Respuesta de GMAX Academy' : 'Tú'}:</b> ${escapeHtmlDash(r.message)}
      </div>
    `).join('');
    const statusLabel = { abierto:'Abierto', respondido:'Respondido', cerrado:'Cerrado' }[t.status] || t.status;
    return `
      <div class="ticket-item">
        <div class="t-head">
          <span>${new Date(t.created_at).toLocaleDateString('es-US',{day:'2-digit',month:'short',year:'numeric'})}</span>
          <span class="ticket-badge ${t.status}">${statusLabel}</span>
        </div>
        <div class="t-subject">${t.subject ? escapeHtmlDash(t.subject) : 'Sin asunto'}</div>
        <div style="font-size:13px;color:var(--ink);margin-top:4px;">${escapeHtmlDash(t.message)}</div>
        ${repliesHtml}
      </div>
    `;
  }).join('');
}

document.getElementById('sendSupportBtn').addEventListener('click', async ()=>{
  const subject = document.getElementById('supportSubjectInput').value.trim();
  const message = document.getElementById('supportMessageInput').value.trim();
  const msgEl = document.getElementById('supportMsg');
  const btn = document.getElementById('sendSupportBtn');

  if (!message){
    msgEl.textContent = 'Escribe tu mensaje antes de enviarlo.';
    msgEl.className = 'msg-inline error show';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const { data: ticket, error } = await sb.from('support_tickets').insert({
    user_id: currentUser.id,
    course_id: currentCourse ? currentCourse.id : null,
    subject: subject || null,
    message,
    status: 'abierto'
  }).select().single();

  if (error){
    msgEl.textContent = 'Error al enviar: ' + error.message;
    msgEl.className = 'msg-inline error show';
    btn.disabled = false;
    btn.textContent = 'Enviar mensaje';
    return;
  }

  // Avisa a la administradora por correo. Si el correo falla por algún
  // motivo, el mensaje ya quedó guardado y visible en su panel igual.
  fetch('https://kxdkmtpyduuruhhzfpmg.supabase.co/functions/v1/support-notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
    body: JSON.stringify({ type: 'new_ticket', ticketId: ticket.id })
  }).catch(()=>{});

  document.getElementById('supportSubjectInput').value = '';
  document.getElementById('supportMessageInput').value = '';
  msgEl.textContent = '¡Mensaje enviado! Te responderemos pronto.';
  msgEl.className = 'msg-inline ok show';
  btn.disabled = false;
  btn.textContent = 'Enviar mensaje';
  await loadSupportHistory();
});

init();
</script>
