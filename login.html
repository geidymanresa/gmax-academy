<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión — GMAX Insurance Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy:#0F2447; --blue:#1E4C9A; --blue-light:#2E5FB8;
    --gold:#F0B429; --gold-dark:#D69A1C;
    --bg:#F5F7FB; --ink:#12294F; --slate:#5A6478; --line:#E1E5EF; --white:#FFFFFF;
    --error:#D64545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif;color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:linear-gradient(160deg,var(--navy) 0%, var(--blue) 55%, var(--blue-light) 100%);
    position:relative;overflow:hidden;
  }
  a{text-decoration:none;}

  .bg-arrow{position:absolute;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none;}

  .center-wrap{position:relative;z-index:2;width:100%;max-width:440px;text-align:center;}
  .brand{margin-bottom:26px;color:#fff;}
  .logo{font-family:'Sora',sans-serif;font-weight:800;font-size:24px;}
  .logo span{color:var(--gold);font-weight:700;font-size:12.5px;letter-spacing:.1em;display:block;text-transform:uppercase;margin-top:4px;}

  .panel{
    width:100%;background:var(--white);border-radius:20px;
    padding:44px 40px;text-align:left;
    box-shadow:0 30px 60px -20px rgba(15,36,71,.5);
  }
  .panel h2{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;color:var(--navy);margin-bottom:8px;}
  .panel p.sub{color:var(--slate);font-size:14.5px;margin-bottom:28px;}

  label{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--navy);display:block;margin-bottom:7px;}
  input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-family:'Inter',sans-serif;font-size:14.5px;margin-bottom:18px;transition:border-color .15s;
  }
  input:focus{outline:none;border-color:var(--blue);}

  .btn{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:var(--blue);color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px;
    cursor:pointer;transition:transform .15s, box-shadow .15s;
    box-shadow:0 4px 14px rgba(30,76,154,.28);
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

  .msg{
    font-size:13.5px;padding:11px 14px;border-radius:8px;margin-bottom:18px;display:none;
  }
  .msg.error{background:#FCE9E9;color:var(--error);display:block;}
  .msg.ok{background:#E8F3EA;color:#2A7A3B;display:block;}

  .foot-links{display:flex;justify-content:space-between;margin-top:20px;font-size:13px;}
  .foot-links a{color:var(--blue);font-weight:600;}
  .back{display:inline-flex;align-items:center;gap:6px;color:#C6D2E8;font-size:13.5px;margin-bottom:18px;justify-content:center;}

  @media(max-width:520px){
    .panel{padding:32px 24px;border-radius:16px;}
  }
</style>
</head>
<body>

<svg class="bg-arrow" viewBox="0 0 500 500" fill="none" preserveAspectRatio="xMidYMid slice">
  <polyline points="60,440 160,370 240,400 340,220 440,80" stroke="#F0B429" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="60" cy="440" r="6" fill="#fff"/><circle cx="160" cy="370" r="6" fill="#fff"/>
  <circle cx="240" cy="400" r="6" fill="#fff"/><circle cx="340" cy="220" r="6" fill="#fff"/>
</svg>

<div class="center-wrap">
  <div class="back"><a href="index.html" style="color:#C6D2E8;">← Volver a la página principal</a></div>
  <div class="brand">
    <div class="logo">GMAX <span>Insurance Academy</span></div>
  </div>

<div class="panel" id="loginPanel">
  <h2>Iniciar sesión</h2>
  <p class="sub">Entra con el correo que usaste al comprar tu curso.</p>

  <div id="msg" class="msg"></div>

  <form id="loginForm">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
  </form>

  <div class="foot-links">
    <a href="recuperar-clave.html">¿Olvidaste tu contraseña?</a>
    <a href="recuperar-clave.html">Aún no tengo cuenta</a>
  </div>
  </div>
</div>

<script>
  // ---- Configuración de Supabase ----
  const SUPABASE_URL = 'https://kxdkmtpyduuruhhzfpmg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_dCutSlRXT1IbMMXLOc4RYw__ztiQBE4';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  // Genera y guarda un token de sesión único para este dispositivo,
  // y lo registra en la base de datos (esto "desconecta" cualquier otro dispositivo
  // que haya iniciado sesión antes con la misma cuenta).
  // Generador de ID único que funciona incluso sin HTTPS (crypto.randomUUID requiere contexto seguro)
  function generateId(){
    if (window.crypto && window.crypto.randomUUID) {
      try { return window.crypto.randomUUID(); } catch(e) {}
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
  }

  async function registerDeviceSession(userId){
    const token = generateId();
    const deviceLabel = navigator.userAgent.slice(0, 120);

    await sb.from('active_sessions').upsert({
      user_id: userId,
      session_token: token,
      device_label: deviceLabel,
      updated_at: new Date().toISOString()
    });

    localStorage.setItem('gmax_session_token', token);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';
    msg.className = 'msg';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg('Correo o contraseña incorrectos. Intenta de nuevo.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Iniciar sesión';
      return;
    }

    const userId = data.user.id;

    // Marca este dispositivo como el activo (desplaza a cualquier otro)
    await registerDeviceSession(userId);

    // Busca el rol del usuario para saber a dónde mandarlo
    const { data: profile, error: profileError } = await sb
      .from('profiles')
      .select('role, full_name')
      .eq('id', userId)
      .single();

    if (profileError || !profile) {
      showMsg('No se pudo cargar tu perfil. Contacta a soporte.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Iniciar sesión';
      return;
    }

    showMsg('¡Bienvenido/a, ' + (profile.full_name || 'de nuevo') + '! Entrando...', 'ok');

    setTimeout(() => {
      if (profile.role === 'admin' || profile.role === 'super_admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }, 700);
  });
</script>

</body>
</html>
